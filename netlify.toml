[build]
  functions = "functions"
  publish = "public"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_USERNAME"

[functions]
  node_bundler = "zisi"
  included_files = ["views/**", "node_modules/marked/**"]

[[redirects]]
  force = false
  from = "/*"
  status = 200
  to = "/.netlify/functions/server/:splat"